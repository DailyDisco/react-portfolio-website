<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-labelledby="title description">
  <title id="title">Seven production workflows moved from AWS and Kestra to Railway and n8n</title>
  <desc id="description">Architecture overview of a September 2026 migration. Seven parallel routes connect the previous AWS and Kestra platform to Railway and n8n.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffef8"/>
      <stop offset="1" stop-color="#e6e7df"/>
    </linearGradient>
    <pattern id="registration" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.65" fill="#171a19" opacity="0.13"/>
    </pattern>
  </defs>
  <rect fill="url(#paper)" width="1000" height="625" rx="20"/>
  <rect fill="url(#registration)" width="1000" height="625" rx="20"/>
  <g fill="#171a19" font-family="Arial, Helvetica, sans-serif">
