    <text x="714" y="171" font-size="53" font-weight="600" letter-spacing="-2.5">Railway</text>
    <text x="65" y="207" font-size="22" fill="#535b52">Kestra</text>
    <text x="717" y="207" font-size="22" fill="#535b52">n8n</text>
  </g>
  <g fill="none" stroke="#535b52" stroke-width="1.6">
    <path d="M127 282H261C323 282 326 246 389 246H581C648 246 650 282 717 282H872"/>
