    <circle cx="123" cy="320" r="4"/><circle cx="123" cy="339" r="4" stroke="#364bff"/>
    <circle cx="123" cy="358" r="4"/><circle cx="123" cy="377" r="4"/>
    <circle cx="123" cy="396" r="4"/>
  </g>
  <g fill="#535b52">
    <circle cx="876" cy="282" r="3.5"/><circle cx="876" cy="301" r="3.5"/>
    <circle cx="876" cy="320" r="3.5"/><circle cx="876" cy="339" r="4" fill="#364bff"/>
    <circle cx="876" cy="358" r="3.5"/><circle cx="876" cy="377" r="3.5"/>
    <circle cx="876" cy="396" r="3.5"/>
